        console.log("Button got clicked");
        const leftAngle = Number(
          ggbApplet.getValueString("alpha").split("=")[1].trim().slice(0, -1)
        );
        const rightAngle = Number(ggbApplet.getValueString("α").split("=")[1].trim().slice(0, -1));
        console.log("Left Angle", leftAngle);
        console.log("Right angle", rightAngle);
        if (leftAngle === 90) {
          ggbApplet.setVisible("α", false);
          ggbApplet.setVisible("alpha", true);
          window.parent.triggerToast(true);
        } else if (rightAngle === 90) {
          ggbApplet.setVisible("alpha", false);
          ggbApplet.setVisible("α", true);
          window.parent.triggerToast(true);
        } else {
          ggbApplet.setVisible("alpha", false);
          ggbApplet.setVisible("α", false);
